<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - StudyAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f8;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            color: #202123;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 32px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 18px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6b7280;
            box-shadow:
                0 0 0 3px rgba(107, 114, 128, 0.10);
        }

        .login-button {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 9px;
            background: #202123;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #111827;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 17px;
        }

        .demo-info {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eeeeee;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                ✦
            </div>

            <h1>
                Welcome to StudyAI
            </h1>

            <p class="subtitle">
                Sign in to continue to your AI Assistant
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <div class="field">

                    <label for="username">
                        Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your name"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Log in
                </button>

            </form>


            <div class="demo-info">
                StudyAI · Free Plan
            </div>

        </div>

    </div>

</body>

</html>
